
name: Build SuperBuffer Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: 5.5.0
          build-config: Release

      - name: Upload SuperBuffer
        uses: actions/upload-artifact@v4
        with:
          name: SuperBuffer-Android64
          path: build/**/*.geode
          if-no-files-found: error
