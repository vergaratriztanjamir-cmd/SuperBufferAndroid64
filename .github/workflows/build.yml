
name: Build SuperBuffer Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SuperBuffer
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload SuperBuffer
        uses: actions/upload-artifact@v4
        with:
          name: SuperBuffer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
